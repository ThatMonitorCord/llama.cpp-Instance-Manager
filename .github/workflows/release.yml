name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements.txt pyinstaller==6.22.3
          .venv/Scripts/python -m unittest discover -s tests -v
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - name: Build installer
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python -c "from manager import VERSION; print(VERSION)").Trim()
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag and application version differ' }
          ./scripts/build.ps1 -Version $version
      - name: Verify installed executable and upgrade
        run: .venv/Scripts/python scripts/smoke_installer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-setup
          path: |
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            .test-data/installer.log
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/*-setup.exe dist/SHA256SUMS.txt --title 'llama.cpp Instance Manager ${{ github.ref_name }}' --notes-file docs/release-notes.md
